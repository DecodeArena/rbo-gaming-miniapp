<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no, viewport-fit=cover">
  <meta name="theme-color" content="#090910">
  <title>RBO GAMING</title>

<script src="https://telegram.org/js/telegram-web-app.js"></script>
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>

<style>
  * {
    margin: 0;
      padding: 0;
      box-sizing: border-box;
    }

    html, body {
      width: 100%;
      height: 100%;
      overflow: hidden;
      background: #090910;
      color: white;
      font-family: Arial, sans-serif;
    }

    .app {
      width: 100%;
      height: 100vh;
      height: 100dvh;
      display: flex;
      flex-direction: column;
    }

    /* GAME AREA: TOP 90% */
    .game-screen {
      flex: 9;
      min-height: 0;
      display: flex;
      flex-direction: column;
      justify-content: center;
      align-items: center;
      background:
        radial-gradient(ellipse at center, #302044 0%, #171321 45%, #090910 100%);
      border-bottom: 2px solid #c9a34e;
      text-align: center;
    }

    .logo {
      color: #e7c46e;
      font-size: clamp(28px, 8vw, 44px);
      font-weight: 900;
      letter-spacing: 3px;
      text-shadow: 0 0 20px #b58b39;
    }

    .tagline {
      margin-top: 12px;
      font-size: 11px;
      letter-spacing: 5px;
      color: #ded5eb;
    }

    .game-placeholder {
      margin-top: 45px;
      padding: 12px 25px;
      border: 1px solid #b99550;
      border-radius: 6px;
      color: #e7c46e;
      font-size: 12px;
      letter-spacing: 2px;
    }

    /* AD AREA: BOTTOM 10% */
    .ad-screen {
      flex: 1;
      min-height: 0;
      overflow: hidden;
      background: #171721;
      position: relative;
    }

    .ad-slot {
      position: absolute;
      inset: 0;
      width: 100%;
      height: 100%;
      overflow: hidden;
    }

    #mybid-video-slot > * {
      max-width: 100%;
      max-height: 100%;
    }

    #mybid-banner-slot {
      display: none;
      width: 100%;
      height: 100%;
      overflow: hidden;
      text-align: center;
    }

    #mybid-banner-slot [data-banner-id="2032190"] {
      width: 100%;
      height: 100%;
      max-height: 100%;
      overflow: hidden;
    }

    .app.game-only .game-screen {
      flex: 1;
      border-bottom: 0;
    }

    .app.game-only .ad-screen {
      display: none;
    }
  </style>
</head>

<body>
  <main class="app">

    <section class="game-screen">
      <div class="logo">RBO GAMING</div>
      <div class="tagline">PLAY. COMPETE. WIN.</div>
      <div class="game-placeholder">GAME DISPLAY</div>
    </section>

    <section class="ad-screen" aria-label="Advertisement">
      <div id="mybid-banner-slot" class="ad-slot">
        <div data-banner-id="2032190"></div>
      </div>
      <div id="mybid-video-slot" class="ad-slot">
        <script async src="https://js.mbidadm.com/static/scripts.js" data-admpid="473304"></script>
      </div>
    </section>

  </main>

  <script>
    const app = document.querySelector(".app");
    const videoSlot = document.getElementById("mybid-video-slot");
    const bannerSlot = document.getElementById("mybid-banner-slot");
    
const SUPABASE_URL = "https://aicercmvgujjhoojcxrd.supabase.co";
const SUPABASE_KEY = "sb_publishable_V4Tz2peDGq8RApI3AF-ZSA_LMv3m8n7";

const supabaseClient = supabase.createClient(
  SUPABASE_URL,
  SUPABASE_KEY
);

async function authenticatePlayer() {
  const { data: sessionData } =
    await supabaseClient.auth.getSession();

  if (sessionData.session) {
    console.log("Player session restored");
    return;
  }

  const tg = window.Telegram?.WebApp;

  if (!tg?.initData) {
    throw new Error("Open RBO GAMING through Telegram");
  }

  const { data, error } =
    await supabaseClient.functions.invoke("telegram-auth", {
      body: { initData: tg.initData }
    });

  if (error || !data?.token_hash) {
    throw new Error("Telegram authentication failed");
  }

  const { error: loginError } =
    await supabaseClient.auth.verifyOtp({
      token_hash: data.token_hash,
      type: "magiclink"
    });

  if (loginError) {
    throw new Error("Could not establish player session");
  }

  console.log("Player authenticated successfully");
}

authenticatePlayer().catch(console.error);
    

    // Give the video placement one 30-second turn, then show the banner.
    function showBanner() {
      videoSlot.replaceChildren();
      videoSlot.style.display = "none";
      bannerSlot.style.display = "block";
    }

    // End the banner turn after 30 seconds and expand the game area.
    function finishAdRound() {
      bannerSlot.replaceChildren();
      app.classList.add("game-only");
    }

    window.setTimeout(showBanner, 30000);
    window.setTimeout(finishAdRound, 60000);

    if (window.Telegram && window.Telegram.WebApp) {
      const tg = window.Telegram.WebApp;
      tg.ready();
      tg.expand();
      tg.setHeaderColor("#090910");
      tg.setBackgroundColor("#090910");
    }
  </script>
</body>
</html>
