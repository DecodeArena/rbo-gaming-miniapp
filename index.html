<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no, viewport-fit=cover">
  <meta name="theme-color" content="#090910">
  <title>RBO GAMING</title>

  <script src="https://telegram.org/js/telegram-web-app.js"></script>

  <style>
    * {
      margin: 0;
      padding: 0;
      box-sizing: border-box;
    }

    html, body {
      width: 100%;
      height: 100%;
      overflow: hidden;
      background: #090910;
      color: white;
      font-family: Arial, sans-serif;
    }

    .app {
      width: 100%;
      height: 100vh;
      height: 100dvh;
      display: flex;
      flex-direction: column;
    }

    /* GAME AREA: TOP 90% */
    .game-screen {
      flex: 9;
      min-height: 0;
      display: flex;
      flex-direction: column;
      justify-content: center;
      align-items: center;
      background:
        radial-gradient(ellipse at center, #302044 0%, #171321 45%, #090910 100%);
      border-bottom: 2px solid #c9a34e;
      text-align: center;
    }

    .logo {
      color: #e7c46e;
      font-size: clamp(28px, 8vw, 44px);
      font-weight: 900;
      letter-spacing: 3px;
      text-shadow: 0 0 20px #b58b39;
    }

    .tagline {
      margin-top: 12px;
      font-size: 11px;
      letter-spacing: 5px;
      color: #ded5eb;
    }

    .game-placeholder {
      margin-top: 45px;
      padding: 12px 25px;
      border: 1px solid #b99550;
      border-radius: 6px;
      color: #e7c46e;
      font-size: 12px;
      letter-spacing: 2px;
    }

    /* WEBSITE AREA: BOTTOM 10% */
    .website-screen {
      flex: 1;
      min-height: 0;
      overflow: hidden;
      background: #171721;
    }

    .website-screen iframe {
      display: block;
      width: 100%;
      height: 100%;
      border: 0;
    }

    .app.game-only .game-screen {
      flex: 1;
      border-bottom: 0;
    }

    .app.game-only .website-screen {
      display: none;
    }
  </style>
</head>

<body>
  <main class="app">

    <section class="game-screen">
      <div class="logo">RBO GAMING</div>
      <div class="tagline">PLAY. COMPETE. WIN.</div>
      <div class="game-placeholder">GAME DISPLAY</div>
    </section>

    <section class="website-screen">
      <iframe id="website-frame" title="Website display"></iframe>
    </section>

  </main>

  <script>
    // ADD OR REMOVE WEBSITE URLS HERE.
    const WEBSITE_URLS = [
      "https://swiftfinger.blogspot.com/p/home.html?m=1",
    ];

    const DISPLAY_TIME = 20000;
    const app = document.querySelector(".app");
    const frame = document.getElementById("website-frame");

    function showWebsite(index) {
      if (index >= WEBSITE_URLS.length) {
        frame.src = "about:blank";
        app.classList.add("game-only");
        return;
      }

      frame.src = WEBSITE_URLS[index];

      window.setTimeout(() => {
        showWebsite(index + 1);
      }, DISPLAY_TIME);
    }

    if (WEBSITE_URLS.length > 0) {
      showWebsite(0);
    } else {
      app.classList.add("game-only");
    }

    if (window.Telegram && window.Telegram.WebApp) {
      const tg = window.Telegram.WebApp;
      tg.ready();
      tg.expand();
      tg.setHeaderColor("#090910");
      tg.setBackgroundColor("#090910");
    }
  </script>
</body>
</html>
