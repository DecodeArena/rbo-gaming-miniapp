<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no, viewport-fit=cover">
  <meta name="theme-color" content="#090910">
  <title>RBO GAMING</title>

  <script src="https://telegram.org/js/telegram-web-app.js"></script>

  <style>
    * {
      margin: 0;
      padding: 0;
      box-sizing: border-box;
    }

    html, body {
      width: 100%;
      height: 100%;
      overflow: hidden;
      background: #090910;
      color: white;
      font-family: Arial, sans-serif;
    }

    .app {
      width: 100%;
      height: 100vh;
      height: 100dvh;
      display: flex;
      flex-direction: column;
    }

    /* GAME AREA */
    .game-screen {
      flex: 9;
      min-height: 0;
      display: flex;
      justify-content: center;
      align-items: center;
      overflow: auto;
      background: #090910;
      position: relative;
    }

    /* ORIGINAL LOBBY GRAPHIC */
    .lobby-art {
      width: min(100%, 60dvh);
      aspect-ratio: 2 / 3;
      position: relative;
      flex-shrink: 0;
    }

    .lobby-art img {
      display: block;
      width: 100%;
      height: 100%;
      object-fit: contain;
    }

    /* INVISIBLE INTERACTIVE BUTTONS */
    .hotspot {
      position: absolute;
      border: 0;
      background: transparent;
      cursor: pointer;
      -webkit-tap-highlight-color: transparent;
      touch-action: manipulation;
    }

    .hotspot:focus-visible {
      outline: 2px solid white;
      border-radius: 12px;
    }

    /* GAME PLAY BUTTONS */
    .play-maze {
      left: 28.8%;
      top: 36.3%;
      width: 18.6%;
      height: 4.5%;
    }

    .play-rps {
      left: 76.8%;
      top: 36.3%;
      width: 18.6%;
      height: 4.5%;
    }

    .play-tictactoe {
      left: 28.8%;
      top: 52.5%;
      width: 18.6%;
      height: 4.5%;
    }

    .play-reaction {
      left: 76.8%;
      top: 52.5%;
      width: 18.6%;
      height: 4.5%;
    }

    .play-memory {
      left: 28.8%;
      top: 68.8%;
      width: 18.6%;
      height: 4.5%;
    }

    .play-connect {
      left: 76.8%;
      top: 68.8%;
      width: 18.6%;
      height: 4.5%;
    }

    .play-number {
      left: 28.8%;
      top: 85.1%;
      width: 18.6%;
      height: 4.5%;
    }

    .play-word {
      left: 76.8%;
      top: 85.1%;
      width: 18.6%;
      height: 4.5%;
    }

    /* BOTTOM NAVIGATION */
    .nav-lobby {
      left: 0;
      top: 90.3%;
      width: 20%;
      height: 9.7%;
    }

    .nav-games {
      left: 20%;
      top: 90.3%;
      width: 20%;
      height: 9.7%;
    }

    .nav-stats {
      left: 40%;
      top: 90.3%;
      width: 20%;
      height: 9.7%;
    }

    .nav-rewards {
      left: 60%;
      top: 90.3%;
      width: 20%;
      height: 9.7%;
    }

    .nav-leaderboard {
      left: 80%;
      top: 90.3%;
      width: 20%;
      height: 9.7%;
    }

    /* NOTIFICATION */
    .toast {
      position: fixed;
      z-index: 20;
      left: 50%;
      bottom: 13%;
      transform: translateX(-50%);
      width: max-content;
      max-width: 90%;
      padding: 12px 18px;
      border: 1px solid #d8aaff;
      border-radius: 12px;
      background: #21103b;
      color: white;
      font-size: 13px;
      text-align: center;
      box-shadow: 0 0 18px #8d32ff;
      display: none;
    }

    .toast.show {
      display: block;
    }

    /* AD AREA */
    .ad-screen {
      flex: 1;
      min-height: 0;
      overflow: hidden;
      background: #171721;
      position: relative;
    }

    .ad-slot {
      position: absolute;
      inset: 0;
      width: 100%;
      height: 100%;
      overflow: hidden;
    }

    #mybid-video-slot > * {
      max-width: 100%;
      max-height: 100%;
    }

    #mybid-banner-slot {
      display: none;
      width: 100%;
      height: 100%;
      overflow: hidden;
      text-align: center;
    }

    #mybid-banner-slot [data-banner-id="2032190"] {
      width: 100%;
      height: 100%;
      max-height: 100%;
      overflow: hidden;
    }

    .app.game-only .game-screen {
      flex: 1;
    }

    .app.game-only .ad-screen {
      display: none;
    }

    @media (max-height: 650px) {
      .game-screen {
        align-items: flex-start;
      }
    }
  </style>
</head>

<body>
  <main class="app">

    <section class="game-screen">

      <div class="lobby-art">

        <img src="./rbo-lobby.png" alt="RBO Gaming 1v1 Game Lobby">

        <!-- GAME BUTTONS -->
        <button class="hotspot play-maze"
          aria-label="Play Maze Race"
          onclick="playGame('Maze Race')"></button>

        <button class="hotspot play-rps"
          aria-label="Play Rock Paper Scissors"
          onclick="playGame('Rock Paper Scissors')"></button>

        <button class="hotspot play-tictactoe"
          aria-label="Play Tic-Tac-Toe"
          onclick="playGame('Tic-Tac-Toe')"></button>

        <button class="hotspot play-reaction"
          aria-label="Play Reaction Duel"
          onclick="playGame('Reaction Duel')"></button>

        <button class="hotspot play-memory"
          aria-label="Play Memory Match"
          onclick="playGame('Memory Match')"></button>

        <button class="hotspot play-connect"
          aria-label="Play Connect Four"
          onclick="playGame('Connect Four')"></button>

        <button class="hotspot play-number"
          aria-label="Play Number Guess"
          onclick="playGame('Number Guess')"></button>

        <button class="hotspot play-word"
          aria-label="Play Word Scramble"
          onclick="playGame('Word Scramble')"></button>

        <!-- BOTTOM NAVIGATION -->
        <button class="hotspot nav-lobby"
          aria-label="Lobby"
          onclick="showSection('Lobby')"></button>

        <button class="hotspot nav-games"
          aria-label="My Games"
          onclick="showSection('My Games')"></button>

        <button class="hotspot nav-stats"
          aria-label="Stats"
          onclick="showSection('Stats')"></button>

        <button class="hotspot nav-rewards"
          aria-label="Rewards"
          onclick="showSection('Rewards')"></button>

        <button class="hotspot nav-leaderboard"
          aria-label="Leaderboard"
          onclick="showSection('Leaderboard')"></button>

      </div>

    </section>

    <div class="toast" id="toast" role="status" aria-live="polite"></div>

    <!-- AD AREA -->
    <section class="ad-screen" aria-label="Advertisement">

      <div id="mybid-banner-slot" class="ad-slot">
        <div data-banner-id="2032190"></div>
      </div>

      <div id="mybid-video-slot" class="ad-slot">
        <script async src="https://js.mbidadm.com/static/scripts.js" data-admpid="473304"></script>
      </div>

    </section>

  </main>

  <script>
    const app = document.querySelector(".app");
    const videoSlot = document.getElementById("mybid-video-slot");
    const bannerSlot = document.getElementById("mybid-banner-slot");
    const toast = document.getElementById("toast");

    let toastTimer;

    function showMessage(message) {
      toast.textContent = message;
      toast.classList.add("show");

      clearTimeout(toastTimer);

      toastTimer = window.setTimeout(() => {
        toast.classList.remove("show");
      }, 2500);
    }

    function playGame(gameName) {
      showMessage(gameName + " matchmaking will be connected later.");
    }

    function showSection(sectionName) {
      if (sectionName === "Lobby") {
        showMessage("You are in the Game Lobby.");
        return;
      }

      showMessage(sectionName + " will be available soon.");
    }

    // Show banner after the video advertisement turn.
    function showBanner() {
      videoSlot.replaceChildren();
      videoSlot.style.display = "none";
      bannerSlot.style.display = "block";
    }

    // End the advertisement round after 60 seconds.
    function finishAdRound() {
      bannerSlot.replaceChildren();
      app.classList.add("game-only");
    }

    window.setTimeout(showBanner, 30000);
    window.setTimeout(finishAdRound, 60000);

    // Telegram Mini App setup.
    if (window.Telegram && window.Telegram.WebApp) {
      const tg = window.Telegram.WebApp;

      tg.ready();
      tg.expand();
      tg.setHeaderColor("#090910");
      tg.setBackgroundColor("#090910");
    }
  </script>
</body>
</html>
