<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no, viewport-fit=cover">
<meta name="theme-color" content="#090910">
<title>RBO GAMING</title>
<script src="https://telegram.org/js/telegram-web-app.js"></script>
<style>
*{box-sizing:border-box;margin:0;padding:0}
html,body{width:100%;height:100%;overflow:hidden;background:#090910}
.app{width:100%;height:100vh;height:100dvh;position:relative;background:#090910;overflow:hidden}
.screen{position:absolute;inset:0;display:none;align-items:center;justify-content:center;background:#090910}
.screen.active{display:flex}
.art-wrap{position:relative;width:100%;height:100%;display:flex;align-items:center;justify-content:center}
.art{display:block;width:100%;height:100%;object-fit:fill}
.hotspot{position:absolute;border:0;background:transparent;cursor:pointer;-webkit-tap-highlight-color:transparent;touch-action:manipulation}
.hotspot:focus-visible{outline:2px solid #49b9ff;border-radius:12px}
/* Start screen: tap the GAME DISPLAY area to enter the lobby */
.start-enter{left:27.8%;top:55.2%;width:44.5%;height:7.2%}
/* Dashboard Play buttons: blue replacements over the original yellow buttons */
.play{height:4.15%;width:18.8%;border:1px solid #49b9ff;border-radius:14px;background:linear-gradient(135deg,#1689ff,#3155ed 65%,#7044f5);box-shadow:0 0 10px #1689ff88;color:#fff;font:800 clamp(10px,3.3vw,16px) Arial,sans-serif;display:flex;align-items:center;justify-content:center;gap:5px}
.play:active{filter:brightness(1.25)}
.p1{left:28.8%;top:37.3%}.p2{left:76.8%;top:37.3%}
.p3{left:28.8%;top:53.6%}.p4{left:76.8%;top:53.6%}
.p5{left:28.8%;top:69.8%}.p6{left:76.8%;top:69.8%}
.p7{left:28.8%;top:86.1%}.p8{left:76.8%;top:86.1%}
.nav{height:9.7%;width:20%;bottom:0}
.n1{left:0}.n2{left:20%}.n3{left:40%}.n4{left:60%}.n5{left:80%}
.toast{position:absolute;z-index:5;left:50%;bottom:12%;transform:translateX(-50%);width:max-content;max-width:90%;padding:12px 18px;border:1px solid #55baff;border-radius:12px;background:#101d3c;color:white;text-align:center;font:14px Arial;box-shadow:0 0 18px #218bff;display:none}
.toast.show{display:block}
@media(max-height:650px){.art{object-fit:fill}}
</style>
</head>
<body>
<main class="app">
  <section id="start" class="screen active" aria-label="RBO Gaming start screen">
    <div class="art-wrap">
      <img class="art" src="rbo-start.png" alt="RBO GAMING start screen">
      <button class="hotspot start-enter" aria-label="Enter game lobby" onclick="openLobby()"></button>
    </div>
  </section>

  <section id="dashboard" class="screen" aria-label="RBO Gaming lobby">
    <div class="art-wrap">
      <img class="art" src="rbo-lobby.png" alt="RBO GAMING 1v1 lobby">
      <button class="hotspot play p1" onclick="playGame('Maze Race')" aria-label="Play Maze Race">Play 1v1 ▶</button>
      <button class="hotspot play p2" onclick="playGame('Rock Paper Scissors')" aria-label="Play Rock Paper Scissors">Play 1v1 ▶</button>
      <button class="hotspot play p3" onclick="playGame('Tic-Tac-Toe')" aria-label="Play Tic-Tac-Toe">Play 1v1 ▶</button>
      <button class="hotspot play p4" onclick="playGame('Reaction Duel')" aria-label="Play Reaction Duel">Play 1v1 ▶</button>
      <button class="hotspot play p5" onclick="playGame('Memory Match')" aria-label="Play Memory Match">Play 1v1 ▶</button>
      <button class="hotspot play p6" onclick="playGame('Connect Four')" aria-label="Play Connect Four">Play 1v1 ▶</button>
      <button class="hotspot play p7" onclick="playGame('Number Guess')" aria-label="Play Number Guess">Play 1v1 ▶</button>
      <button class="hotspot play p8" onclick="playGame('Word Scramble')" aria-label="Play Word Scramble">Play 1v1 ▶</button>
      <button class="hotspot nav n1" onclick="showMessage('You are in the Lobby.')" aria-label="Lobby"></button>
      <button class="hotspot nav n2" onclick="showMessage('My Games will be available later.')" aria-label="My Games"></button>
      <button class="hotspot nav n3" onclick="showMessage('Stats will be available later.')" aria-label="Stats"></button>
      <button class="hotspot nav n4" onclick="showMessage('Rewards will be available later.')" aria-label="Rewards"></button>
      <button class="hotspot nav n5" onclick="showMessage('Leaderboard will be available later.')" aria-label="Leaderboard"></button>
    </div>
  </section>
  <div id="toast" class="toast" role="status" aria-live="polite"></div>
</main>
<script>
const toast=document.getElementById('toast');let timer;
function openLobby(){document.getElementById('start').classList.remove('active');document.getElementById('dashboard').classList.add('active')}
function playGame(name){showMessage(name+' matchmaking will be connected later.')}
function showMessage(message){toast.textContent=message;toast.classList.add('show');clearTimeout(timer);timer=setTimeout(()=>toast.classList.remove('show'),2500)}
if(window.Telegram&&window.Telegram.WebApp){const tg=window.Telegram.WebApp;tg.ready();tg.expand();tg.setHeaderColor('#090910');tg.setBackgroundColor('#090910')}
</script>
</body>
</html>
