<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no, viewport-fit=cover">
  <meta name="theme-color" content="#090910">
  <title>RBO GAMING</title>

  <script src="https://telegram.org/js/telegram-web-app.js"></script>

  <style>
    * {
      margin: 0;
      padding: 0;
      box-sizing: border-box;
    }

    html, body {
      width: 100%;
      height: 100%;
      overflow: hidden;
      background: #090910;
      color: white;
      font-family: Arial, sans-serif;
    }

    .app {
      width: 100%;
      height: 100vh;
      height: 100dvh;
      display: flex;
      flex-direction: column;
    }

    /* GAME AREA: TOP 90% */
    .game-screen {
      flex: 9;
      min-height: 0;
      display: flex;
      flex-direction: column;
      justify-content: center;
      align-items: center;
      background:
        radial-gradient(ellipse at center, #302044 0%, #171321 45%, #090910 100%);
      border-bottom: 2px solid #c9a34e;
      text-align: center;
    }

    .logo {
      color: #e7c46e;
      font-size: clamp(28px, 8vw, 44px);
      font-weight: 900;
      letter-spacing: 3px;
      text-shadow: 0 0 20px #b58b39;
    }

    .tagline {
      margin-top: 12px;
      font-size: 11px;
      letter-spacing: 5px;
      color: #ded5eb;
    }

    .game-placeholder {
      margin-top: 45px;
      padding: 12px 25px;
      border: 1px solid #b99550;
      border-radius: 6px;
      color: #e7c46e;
      font-size: 12px;
      letter-spacing: 2px;
    }

    /* AD AREA: BOTTOM 10% */
    .ad-screen {
      flex: 1;
      min-height: 0;
      overflow: hidden;
      background: #171721;
      position: relative;
    }

    .ad-slot {
      width: 100%;
      height: 100%;
      overflow: hidden;
    }

    #mybid-video-slot > * {
      max-width: 100%;
      max-height: 100%;
    }

    #mybid-banner-slot {
      display: none;
      width: 100%;
      height: 100%;
      overflow: hidden;
      text-align: center;
    }

    #mybid-banner-slot [data-banner-id="2032190"] {
      width: 100%;
      height: 100%;
      max-height: 100%;
      overflow: hidden;
    }

    .app.game-only .game-screen {
      flex: 1;
      border-bottom: 0;
    }

    .app.game-only .website-screen {
      display: none;
    }
  </style>
</head>

<body>
  <main class="app">

    <section class="game-screen">
      <div class="logo">RBO GAMING</div>
      <div class="tagline">PLAY. COMPETE. WIN.</div>
      <div class="game-placeholder">GAME DISPLAY</div>
    </section>

    <section class="ad-screen" aria-label="Advertisement">
      <div id="mybid-video-slot" class="ad-slot">
        <script async src="https://js.mbidadm.com/static/scripts.js" data-admpid="473304"></script>
      </div>
      <div id="mybid-banner-slot" class="ad-slot">
        <div data-banner-id="2032190"></div>
      </div>
    </section>

  </main>

  <script>
    const app = document.querySelector(".app");
    const videoSlot = document.getElementById("mybid-video-slot");
    const bannerSlot = document.getElementById("mybid-banner-slot");

    // Show the MyBid banner after the 30-second video turn.
    function showBanner() {
      // Removing injected video content also tears down any player/iframe
      // that MyBid placed inside the dedicated video slot.
      videoSlot.replaceChildren();
      videoSlot.style.display = "none";
      bannerSlot.style.display = "block";
    }

    // Keep the banner for 30 seconds, then give the game the full screen.
    function finishAdRound() {
      bannerSlot.replaceChildren();
      app.classList.add("game-only");
    }

    const myBidVideoTag = videoSlot.querySelector('script[data-admpid="473304"]');
    if (myBidVideoTag) {
      myBidVideoTag.addEventListener("load", () => {
        window.setTimeout(showBanner, 30000);
      }, { once: true });
      myBidVideoTag.addEventListener("error", () => {
        showBanner();
      }, { once: true });
      // Safety fallback if the network never completes the script request.
      window.setTimeout(() => {
        if (videoSlot.style.display !== "none") showBanner();
      }, 30000);
    } else {
      showBanner();
    }

    // Start the banner's 30-second display when it becomes visible.
    const bannerObserver = new MutationObserver(() => {
      if (bannerSlot.style.display === "block") {
        bannerObserver.disconnect();
        window.setTimeout(finishAdRound, 30000);
      }
    });
    bannerObserver.observe(bannerSlot, { attributes: true, attributeFilter: ["style"] });

    if (window.Telegram && window.Telegram.WebApp) {
      const tg = window.Telegram.WebApp;
      tg.ready();
      tg.expand();
      tg.setHeaderColor("#090910");
      tg.setBackgroundColor("#090910");
    }
  </script>
</body>
</html>
